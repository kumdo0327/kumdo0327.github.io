<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Differencing Survey</title>
<style>
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --ink: #1c2430;
  --muted: #5e6b7b;
  --line: #d6dde8;
  --brand: #1f6feb;
  --brand-soft: #e9f2ff;
  --ok: #0f8d54;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 240px);
}
.app {
  width: 100%;
  margin: 0;
  padding: 20px 20px 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
.topbar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.title {
  margin: 0;
  font-size: 20px;
}
.subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}
.progress-wrap {
  min-width: 280px;
  text-align: right;
}
.progress-text {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-bar {
  height: 10px;
  border-radius: 999px;
  background: #e5ecf7;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4d98ff, var(--brand));
  width: 0%;
}
.layout {
  margin-top: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 14px;
  flex: 1 1 auto;
  min-height: 0;
}
.layout.layout-intro {
  grid-template-columns: minmax(0, 1fr) 480px;
}
.layout.layout-tutorial {
  grid-template-columns: minmax(0, 1fr) 480px;
}
.layout.layout-question {
  grid-template-columns: minmax(0, 1fr) 240px;
}
.viewer-panel,
.control-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.viewer-panel {
  display: flex;
  flex-direction: column;
  padding: 10px;
  min-height: 0;
  overflow: hidden;
}
.control-panel {
  padding: 14px;
  min-height: 0;
  overflow: auto;
}
.step-header {
  margin-bottom: 10px;
  flex: 0 0 auto;
}
#viewerRoot {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}
.badge {
  display: inline-block;
  background: var(--brand-soft);
  color: #0c4ca8;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.step-title {
  margin: 8px 0 4px;
  font-size: 22px;
}
.step-desc {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}
.tutorial-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.tutorial-shell {
  height: 100%;
  min-height: 0;
}
.compare {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}
.tabbar {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
  padding: 0 6px;
}
.compare-item {
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
}
.tab-btn {
  border: 1px solid var(--line);
  border-bottom: 0;
  border-top-left-radius: 10px;
  border-top-right-radius: 10px;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  background: #e8edf5;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #4b5868;
  cursor: pointer;
  transform: translateY(1px);
}
.tab-btn.active {
  border-color: var(--brand);
  background: #fff;
  color: #0c4ca8;
  font-weight: 700;
}
.viewer-stack {
  position: relative;
  min-height: 0;
  height: 100%;
}
.viewer-pane {
  display: none;
  width: 100%;
  height: 100%;
}
.viewer-pane.active {
  display: block;
}
.compare iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.form-section {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
}
.form-title {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
}
.choices,
.reason-list,
.scale {
  display: grid;
  gap: 8px;
}
label.option {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
}
label.option input {
  margin-top: 2px;
}
.scale {
  grid-template-columns: repeat(5, 1fr);
}
.scale label.option {
  justify-content: center;
  align-items: center;
  text-align: center;
}
textarea {
  width: 100%;
  min-height: 88px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  resize: vertical;
  font: inherit;
  font-size: 13px;
}
input[type="text"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  font: inherit;
  font-size: 14px;
}
.help {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.tutorial-guide {
  background: #f7f9fc;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}
.tutorial-guide p {
  margin: 0 0 6px;
  font-size: 13px;
}
.tutorial-guide ul {
  margin: 0;
  padding-left: 18px;
  color: #304152;
}
.tutorial-guide li {
  margin: 4px 0;
  font-size: 13px;
}
.error {
  color: #bd1d1d;
  margin-top: 8px;
  font-size: 13px;
  min-height: 18px;
}
.actions {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 14px;
}
button {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
button.primary {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.summary {
  display: none;
}
.summary.active {
  display: block;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.kpi {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fff;
}
.kpi strong {
  display: block;
  font-size: 18px;
  color: var(--ok);
}
@media (max-width: 1200px) {
  .app {
    height: auto;
    min-height: 100dvh;
  }
  .layout {
    grid-template-columns: 1fr;
  }
  .compare {
    height: 100%;
  }
  .tutorial-frame {
    height: 100%;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1 class="title">Tree Differencing Survey</h1>
      <p class="subtitle">튜토리얼 4개 + 본문항 30개 (A/B 비교 평가)</p>
    </div>
    <div class="progress-wrap">
      <div id="progressText" class="progress-text"></div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>
  </div>

  <div id="surveyLayout" class="layout">
    <section id="viewerPanel" class="viewer-panel">
      <div class="step-header">
        <span id="stepBadge" class="badge">준비</span>
        <h2 id="stepTitle" class="step-title"></h2>
        <p id="stepDesc" class="step-desc"></p>
      </div>
      <div id="viewerRoot"></div>
    </section>

    <aside class="control-panel">
      <div id="participantSection" class="form-section">
        <p class="form-title">이름</p>
        <input id="participantName" type="text">
        <p class="form-title" style="margin-top:10px;">소속</p>
        <input id="participantAffiliation" type="text" placeholder="예: OO대학교 / OO회사">
        <p class="form-title" style="margin-top:10px;">학위</p>
        <input id="participantRole" type="text" placeholder="예: 박사과정 / 석사 / 학부생">
        <p class="form-title" style="margin-top:10px;">경력</p>
        <input id="participantExperience" type="text" placeholder="예: 석사 신입 / OO회사 인턴 6개월">
        <p class="help">응답 저장 시 함께 기록됩니다.</p>
      </div>

      <div id="tutorialForm" class="form-section" style="display:none;">
        <div id="tutorialGuide" class="tutorial-guide" style="display:none;"></div>
        <div id="tutorialPracticeVote" class="tutorial-guide" style="display:none; margin-top:10px;">
          <p><strong>어느 설명이 더 좋았나요?</strong></p>
          <label class="option"><input type="radio" name="practiceVote" value="A"> A가 더 좋음</label>
          <label class="option"><input type="radio" name="practiceVote" value="B"> B가 더 좋음</label>
          <label class="option"><input type="radio" name="practiceVote" value="Unclear"> 불분명함 (unclear)</label>
          <p class="help">연습용 선택이며 실제 설문 데이터에는 저장되지 않습니다.</p>
        </div>
        <label class="option" style="margin-top:20px;"><input type="checkbox" id="tutorialDone"> 튜토리얼 확인</label>
      </div>

      <div id="questionForm" class="form-section" style="display:none;">
        <p class="form-title">어느 설명이 더 좋았나요?</p>
        <div class="choices">
          <label class="option"><input type="radio" name="better" value="A"> A가 더 좋음</label>
          <label class="option"><input type="radio" name="better" value="B"> B가 더 좋음</label>
          <label class="option"><input type="radio" name="better" value="Unclear"> 불분명함 (unclear)</label>
        </div>
      </div>

      <div id="error" class="error"></div>

      <div class="actions">
        <button id="prevBtn" type="button">이전</button>
        <button id="saveBtn" type="button">임시 저장</button>
        <button id="nextBtn" class="primary" type="button">다음</button>
      </div>
    </aside>
  </div>

  <section id="summary" class="summary viewer-panel" style="margin-top:14px;">
    <h2 style="margin:6px 0 8px;">설문 완료</h2>
    <p style="margin:0;color:var(--muted);">응답 데이터를 내려받아 제출하세요.</p>
    <div class="kpis">
      <div class="kpi"><span>총 문항</span><strong>30</strong></div>
      <div class="kpi"><span>응답 완료</span><strong id="doneCount">0</strong></div>
      <div class="kpi"><span>참가자 이름</span><strong id="doneName">-</strong></div>
    </div>
    <div class="actions" style="justify-content:flex-start;">
      <button id="downloadJson" class="primary" type="button">JSON 다운로드</button>
      <button id="restart" type="button">처음부터 다시</button>
    </div>
  </section>
</div>

<script>
const META = [
  { dataset: "d4j", id: 194 },
  { dataset: "d4j", id: 552 },
  { dataset: "d4j", id: 550 },
  { dataset: "d4j", id: 668 },
  { dataset: "d4j", id: 38 },
  { dataset: "d4j", id: 736 },
  { dataset: "d4j", id: 13 },
  { dataset: "d4j", id: 706 },
  { dataset: "d4j", id: 409 },
  { dataset: "d4j", id: 682 },
  { dataset: "d4c_cpp", id: 111 },

  { dataset: "d4c_cpp", id: 53 },
  { dataset: "d4c_c", id: 113 },
  { dataset: "d4c_cpp", id: 21 },
  { dataset: "d4c_cpp", id: 61 },
  { dataset: "bip", id: 185 },
  { dataset: "bip", id: 306 },

  { dataset: "bip", id: 272 },
  { dataset: "bip", id: 21 },
  { dataset: "bip", id: 195 },
  { dataset: "bip", id: 52 }
];

const steps = [
  { kind: "intro", label: "안내", title: "설문 시작", desc: "참가자 기본 정보를 입력하고 진행하세요." },
  { kind: "tutorial", index: 1, file: "tutorial_1.html", label: "튜토리얼", title: "튜토리얼 1/4", desc: "뷰어 조작법과 기초 편집 액션" },
  { kind: "tutorial", index: 2, file: "tutorial_2.html", label: "튜토리얼", title: "튜토리얼 2/4", desc: "Move/Update 편집 액션" },
  { kind: "tutorial", index: 3, file: "tutorial_3.html", label: "튜토리얼", title: "튜토리얼 3/4", desc: "중첩된 편집 정보 구분하기" },
  { kind: "tutorial", index: 4, file: "tutorial_4.html", label: "튜토리얼", title: "튜토리얼 4/4", desc: "Option A/B 선택 및 투표 방법" },
  ...Array.from({ length: 30 }, (_, i) => ({
    kind: "question",
    q: i + 1,
    label: "문항",
    title: `문항 ${i + 1}/30`,
    desc: ""
  }))
];

const TUTORIAL_GUIDES = {
  1: {
    title: "튜토리얼 1: Insert/Delete 편집 액션 예제",
    bullets: [
      "코드 뷰어는 어떻게 왼쪽 코드가 오른쪽으로 변경되었는지를 보여줍니다.",
      "하이라이트된 영역을 클릭하면 해당 영역의 편집 정보를 확인할 수 있습니다.",
      "n / b 키로 편집 정보를 하나씩 순서대로 확인할 수 있습니다.",
      "예시) \"선언문\"을 삭제함 - Edit #1 : Delete \"declaration\"",
      "예시) \"표현문\"을 새로 추가함 - Edit #2 : Insert \"expression_statement\""
    ]
  },
  2: {
    title: "튜토리얼 2: Move/Update 편집 액션 예제",
    bullets: [
      "Update 액션은 단순 텍스트 값이 변경된 경우에 사용됩니다.",
      "Move 액션은 코드의 위치가 변경된 경우에 사용됩니다.",
      "이 예제에서는 (1) printf 안의 문자열이 변경되고 (2) move 함수 호출이 if-문의 첫 번째 실행문으로 이동합니다.",
    ]
  },
  3: {
    title: "튜토리얼 3: 복합 예제",
    bullets: [
      "코드 변경에서는 편집 액션들이 중첩되어 발생할 수 있습니다.",
      "이 예제에서는 (1) if-문이 새로 삽입되고 (2) move 함수 호출이 새로운 if-문으로 이동합니다.",
      "또한, (3) goo 함수 호출을 삭제하고 (4) 인자로 사용된 foo 함수 호출이 원래의 goo 함수 호출 위치로 이동합니다.",
    ]
  },
  4: {
    title: "튜토리얼 4: Option 선택/투표 예제",
    bullets: [
      "Option A/B 탭을 전환하며 두 결과를 번갈아 확인합니다.",
      "비교 후 오른쪽 패널에서 A 또는 B를 선택해 투표합니다.",
      "둘 중 우열을 고르기 어렵다면 '불분명함 (unclear)'을 선택하면 됩니다."
    ]
  }
};

const state = {
  step: 0,
  participantName: "",
  participantAffiliation: "",
  participantRole: "",
  participantExperience: "",
  tutorialDone: {},
  answers: {},
  viewerTabs: {}
};

const els = {
  progressText: document.getElementById("progressText"),
  progressFill: document.getElementById("progressFill"),
  stepBadge: document.getElementById("stepBadge"),
  stepTitle: document.getElementById("stepTitle"),
  stepDesc: document.getElementById("stepDesc"),
  viewerPanel: document.getElementById("viewerPanel"),
  viewerRoot: document.getElementById("viewerRoot"),
  tutorialForm: document.getElementById("tutorialForm"),
  questionForm: document.getElementById("questionForm"),
  tutorialGuide: document.getElementById("tutorialGuide"),
  tutorialPracticeVote: document.getElementById("tutorialPracticeVote"),
  participantSection: document.getElementById("participantSection"),
  participantName: document.getElementById("participantName"),
  participantAffiliation: document.getElementById("participantAffiliation"),
  participantRole: document.getElementById("participantRole"),
  participantExperience: document.getElementById("participantExperience"),
  tutorialDone: document.getElementById("tutorialDone"),
  error: document.getElementById("error"),
  prevBtn: document.getElementById("prevBtn"),
  saveBtn: document.getElementById("saveBtn"),
  nextBtn: document.getElementById("nextBtn"),
  surveyLayout: document.getElementById("surveyLayout"),
  summary: document.getElementById("summary"),
  doneCount: document.getElementById("doneCount"),
  doneName: document.getElementById("doneName"),
  downloadJson: document.getElementById("downloadJson"),
  restart: document.getElementById("restart")
};

const STORAGE_KEY = "tree_diff_survey";

function escapeHtml(v) {
  return String(v)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    if (typeof parsed === "object" && parsed) {
      Object.assign(state, parsed);
      if (!state.participantName && parsed.participantId) {
        state.participantName = parsed.participantId;
      }
      if (!state.participantAffiliation && parsed.participantAffiliation) {
        state.participantAffiliation = parsed.participantAffiliation;
      }
      if (!state.participantRole && parsed.participantRole) {
        state.participantRole = parsed.participantRole;
      }
      if (!state.participantExperience && parsed.participantExperience) {
        state.participantExperience = parsed.participantExperience;
      }
    }
  } catch (_) {
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getChecked(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : "";
}

function setRadio(name, value) {
  document.querySelectorAll(`input[name="${name}"]`).forEach((el) => {
    el.checked = el.value === value;
  });
}

function renderIntro() {
  els.viewerPanel.onclick = null;
  els.viewerRoot.innerHTML = `
    <div style="padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;line-height:1.6;">
      <p style="margin:0 0 10px;">이 설문은 튜토리얼(4개) 후 본문항(30개)으로 구성됩니다. (1-10번: <i>Java</i>, 11-20번: <i>C/C++</i>, 21-30번: <i>Python</i>)</p>
      <p style="margin:0 0 10px;"><strong>평가 기준: 어떤 코드 비교 기법이 가장 이해하기 쉬운 코드 변경 정보를 제공하는가?</strong></p>
      <p style="margin:0 0 5px;">각 문항에서 <b>Option A</b> 또는 <b>Option B</b> 중 하나를 선택하고, 무엇이 더 좋은지 애매하다면 <b>"불분명함"</b>을 선택하세요.</p>
      <p style="margin:0;">&nbsp;* A/B에 해당하는 코드 비교 기법은 문항마다 무작위로 배치되어 있습니다.</p>
    </div>
  `;
  els.tutorialForm.style.display = "none";
  els.questionForm.style.display = "none";
}

function renderTutorial(step) {
  els.viewerRoot.innerHTML = `<div class="tutorial-shell"><iframe tabindex="-1" class="tutorial-frame" src="${escapeHtml(step.file)}"></iframe></div>`;
  const tutorialFrame = els.viewerRoot.querySelector(".tutorial-frame");
  const focusTutorialFrame = () => {
    if (!tutorialFrame) return;
    tutorialFrame.focus();
    try {
      tutorialFrame.contentWindow.focus();
    } catch (_) {
    }
  };
  tutorialFrame?.addEventListener("load", focusTutorialFrame, { once: true });
  els.viewerPanel.onclick = (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.closest(".tab-btn")) return;
    focusTutorialFrame();
  };
  requestAnimationFrame(focusTutorialFrame);
  els.tutorialForm.style.display = "block";
  els.questionForm.style.display = "none";
  const guide = TUTORIAL_GUIDES[step.index];
  if (guide) {
    els.tutorialGuide.style.display = "block";
    els.tutorialGuide.innerHTML = `
      <p><strong>${escapeHtml(guide.title)}</strong></p>
      <ul>${guide.bullets.map((text) => `<li>${escapeHtml(text)}</li>`).join("")}</ul>
    `;
  } else {
    els.tutorialGuide.style.display = "none";
    els.tutorialGuide.innerHTML = "";
  }
  els.tutorialPracticeVote.style.display = step.index === 4 ? "block" : "none";
  els.tutorialDone.checked = Boolean(state.tutorialDone[step.index]);
}

function renderQuestion(step) {
  const q = step.q;
  const answer = state.answers[q] || {};
  const activeTab = state.viewerTabs[q] || "A";
  const focusViewer = (tab) => {
    const pane = els.viewerRoot.querySelector(`.viewer-pane[data-pane="${tab}"]`);
    const iframe = pane ? pane.querySelector("iframe") : null;
    if (!iframe) return;
    iframe.focus();
    try {
      iframe.contentWindow.focus();
    } catch (_) {
    }
  };
  els.viewerRoot.innerHTML = `
    <div class="compare">
      <div class="tabbar">
        <button type="button" class="tab-btn ${activeTab === "A" ? "active" : ""}" data-tab="A">Option A</button>
        <button type="button" class="tab-btn ${activeTab === "B" ? "active" : ""}" data-tab="B">Option B</button>
      </div>
      <div class="compare-item">
        <div class="viewer-stack">
          <div class="viewer-pane ${activeTab === "A" ? "active" : ""}" data-pane="A">
            <iframe tabindex="-1" title="q${q}-A" src="${q}_A.html"></iframe>
          </div>
          <div class="viewer-pane ${activeTab === "B" ? "active" : ""}" data-pane="B">
            <iframe tabindex="-1" title="q${q}-B" src="${q}_B.html"></iframe>
          </div>
        </div>
      </div>
    </div>
  `;
  els.tutorialForm.style.display = "none";
  els.tutorialGuide.style.display = "none";
  els.tutorialPracticeVote.style.display = "none";
  els.questionForm.style.display = "block";

  els.viewerRoot.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      state.viewerTabs[q] = tab;
      saveState();
      els.viewerRoot.querySelectorAll(".tab-btn").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === tab);
      });
      els.viewerRoot.querySelectorAll(".viewer-pane").forEach((el) => {
        el.classList.toggle("active", el.dataset.pane === tab);
      });
      requestAnimationFrame(() => focusViewer(tab));
    });
  });

  els.viewerPanel.onclick = (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;
    if (target.closest(".tab-btn")) return;
    const tab = state.viewerTabs[q] || activeTab;
    focusViewer(tab);
  };

  const activePane = els.viewerRoot.querySelector(`.viewer-pane[data-pane="${activeTab}"]`);
  const activeFrame = activePane ? activePane.querySelector("iframe") : null;
  activeFrame?.addEventListener("load", () => focusViewer(activeTab), { once: true });
  requestAnimationFrame(() => focusViewer(activeTab));

  setRadio("better", answer.better || "");
}

function clearError() {
  els.error.textContent = "";
}

function setError(msg) {
  els.error.textContent = msg;
}

function persistCurrentStep() {
  const step = steps[state.step];
  if (step.kind === "intro") {
    state.participantName = els.participantName.value.trim();
    state.participantAffiliation = els.participantAffiliation.value.trim();
    state.participantRole = els.participantRole.value.trim();
    state.participantExperience = els.participantExperience.value.trim();
  }

  if (step.kind === "tutorial") {
    state.tutorialDone[step.index] = els.tutorialDone.checked;
  }

  if (step.kind === "question") {
    state.answers[step.q] = {
      better: getChecked("better"),
      dataset: META[step.q - 1]?.dataset || "",
      itemId: META[step.q - 1]?.id || ""
    };
  }

  saveState();
}

function validateCurrentStep() {
  const step = steps[state.step];
  if (step.kind === "intro" && !state.participantName) {
    return "참가자 이름을 입력하세요.";
  }
  if (step.kind === "intro" && !state.participantAffiliation) {
    return "소속을 입력하세요.";
  }
  if (step.kind === "intro" && !state.participantRole) {
    return "학위를 입력하세요.";
  }
  if (step.kind === "intro" && !state.participantExperience) {
    return "경력을 입력하세요.";
  }

  if (step.kind === "tutorial" && !state.tutorialDone[step.index]) {
    return "튜토리얼 확인 체크 후 진행하세요.";
  }

  if (step.kind === "question") {
    const ans = state.answers[step.q] || {};
    if (!ans.better) return "A/B/Unclear 중 하나를 선택하세요.";
  }

  return "";
}

function updateProgress() {
  const current = state.step + 1;
  const total = steps.length;
  const pct = Math.max(0, Math.min(100, (current / total) * 100));
  els.progressText.textContent = `${current} / ${total}`;
  els.progressFill.style.width = `${pct}%`;
}

function getQuestionLanguage(q) {
  if (q >= 1 && q <= 10) return "Java";
  if (q >= 11 && q <= 20) return "C/C++";
  return "Python";
}

function render() {
  const step = steps[state.step];
  els.surveyLayout.classList.remove("layout-intro", "layout-tutorial", "layout-question");
  els.surveyLayout.classList.add(`layout-${step.kind}`);
  els.stepBadge.style.display = step.kind === "question" ? "none" : "inline-block";
  els.stepBadge.textContent = step.label;
  els.stepTitle.textContent = step.title;
  els.stepDesc.textContent = step.kind === "question" ? `언어: ${getQuestionLanguage(step.q)}` : step.desc;
  els.participantSection.style.display = step.kind === "intro" ? "block" : "none";
  els.participantName.value = state.participantName;
  els.participantAffiliation.value = state.participantAffiliation;
  els.participantRole.value = state.participantRole;
  els.participantExperience.value = state.participantExperience;
  clearError();

  if (step.kind === "intro") renderIntro();
  if (step.kind === "tutorial") renderTutorial(step);
  if (step.kind === "question") renderQuestion(step);

  els.prevBtn.disabled = state.step === 0;
  els.nextBtn.textContent = state.step === steps.length - 1 ? "완료" : "다음";
  updateProgress();
}

function buildAnswers() {
  return Array.from({ length: 30 }, (_, i) => {
    const q = i + 1;
    const ans = state.answers[q] || {};
    return {
      question: q,
      dataset: ans.dataset || META[i]?.dataset || "",
      item_id: ans.itemId || META[i]?.id || "",
      better: ans.better || ""
    };
  });
}

function download(name, type, text) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function showSummary() {
  persistCurrentStep();
  const answers = buildAnswers();
  const done = answers.filter((r) => r.better).length;
  els.doneCount.textContent = String(done);
  els.doneName.textContent = state.participantName || "-";
  els.surveyLayout.style.display = "none";
  els.summary.classList.add("active");
}

els.prevBtn.addEventListener("click", () => {
  persistCurrentStep();
  if (state.step > 0) state.step -= 1;
  render();
});

els.saveBtn.addEventListener("click", () => {
  persistCurrentStep();
  clearError();
  els.error.style.color = "var(--ok)";
  els.error.textContent = "임시 저장되었습니다.";
  setTimeout(() => {
    els.error.style.color = "#bd1d1d";
    clearError();
  }, 1200);
});

els.nextBtn.addEventListener("click", () => {
  persistCurrentStep();
  const err = validateCurrentStep();
  if (err) {
    setError(err);
    return;
  }
  clearError();

  if (state.step === steps.length - 1) {
    showSummary();
    return;
  }

  state.step += 1;
  render();
});

els.downloadJson.addEventListener("click", () => {
  const payload = {
    participant: {
      name: state.participantName,
      affiliation: state.participantAffiliation,
      role: state.participantRole,
      experience: state.participantExperience
    },
    submittedAt: new Date().toISOString(),
    tutorialDone: state.tutorialDone,
    answers: buildAnswers()
  };
  const name = `${state.participantName || "participant"}_survey(alpha).json`;
  download(name, "application/json", JSON.stringify(payload, null, 2));
});

els.restart.addEventListener("click", () => {
  if (!window.confirm("저장된 진행 상태를 지우고 처음부터 시작할까요?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state.step = 0;
  state.participantName = "";
  state.participantAffiliation = "";
  state.participantRole = "";
  state.participantExperience = "";
  state.tutorialDone = {};
  state.answers = {};
  els.summary.classList.remove("active");
  els.surveyLayout.style.display = "grid";
  render();
});

loadState();
render();
</script>
</body>
</html>
